[package]
name = "fili-ui"
version = "0.4.0"
edition = "2024"
description = "Shared Qt Quick controls and tokens for the Filigrane applications (QML module Fili.UI)"
license = "GPL-3.0-or-later"
repository = "https://github.com/filigrane-os/fili-ui"
# cxx-qt-build propagates the QML module to the crates that depend on this one through the `links` key
links = "fili-ui"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = "0.10.0"
